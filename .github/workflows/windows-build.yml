name: Windows C++ build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        run: cmake -S . -B build -A x64
      - name: Compile executable
        run: cmake --build build --config Release --parallel
      - name: Test HTML, CSS and URL core
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate actual browsing on Google and Internet Archive
        working-directory: build
        run: .\\Release\\AnotherChanceSmoke.exe .\\Release\\AnotherChance.exe --live
      - name: Upload real-site diagnostics (even when compatibility fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnotherChance-Live-Site-Diagnostics
          path: |
            build/AnotherChance-live-google.bmp
            build/AnotherChance-live-archive.bmp
          if-no-files-found: ignore
      # Only publish the executable when live-site interaction passed.
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AnotherChance-Windows-x64
          path: |
            build/Release/AnotherChance.exe
            build/AnotherChance-actual.bmp
            build/AnotherChance-tabbed-ui.bmp
            build/AnotherChance-JS-fallback.bmp
            build/AnotherChance-scripted-dom.bmp
            build/AnotherChance-external-dom.bmp
          if-no-files-found: error
